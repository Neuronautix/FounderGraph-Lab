id: https://foundergraph.dev/ontology/startup
name: startup
title: FounderGraph Startup Ontology
description: |
  LinkML single-source-of-truth ontology for FounderGraph-Lab.
  Mirrors `app/ontology/startup_ontology.yaml` (the legacy editable YAML) but
  encoded in proper LinkML so we can generate Pydantic models, JSON-Schema,
  SHACL shapes, and Cypher DDL deterministically from one file.
version: 0.2.0
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  fg: https://foundergraph.dev/ontology/
  xsd: http://www.w3.org/2001/XMLSchema#
  schema: http://schema.org/

default_prefix: fg
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:
  CriticalityEnum:
    description: Strategic importance of an assumption.
    permissible_values:
      low: {}
      medium: {}
      high: {}
      critical: {}

  SeverityEnum:
    description: Severity of a problem or impact.
    permissible_values:
      low: {}
      medium: {}
      high: {}
      critical: {}

  FrequencyEnum:
    description: How frequently a problem is encountered.
    permissible_values:
      rare: {}
      occasional: {}
      frequent: {}
      constant: {}

  StrengthEnum:
    description: Strength of evidence.
    permissible_values:
      weak: {}
      moderate: {}
      strong: {}

  EvidenceTypeEnum:
    description: Type/source category of evidence.
    permissible_values:
      interview: {}
      experiment: {}
      literature: {}
      market_data: {}
      anecdote: {}
      other: {}

  EvidenceGradeEnum:
    description: How directly the source supports the assertion.
    permissible_values:
      direct_quote: {}
      paraphrase: {}
      inference: {}
      speculation: {}

  ReviewerConfidenceEnum:
    description: Reviewer-assigned confidence for an entity or relation.
    permissible_values:
      strong: {}
      moderate: {}
      weak: {}
      ungraded: {}

  ValidationStatusEnum:
    description: Current validation lifecycle stage.
    permissible_values:
      pending: {}
      validated: {}
      rejected: {}
      needs_more_evidence: {}
      needs_review: {}

  ExperimentStatusEnum:
    description: Lifecycle of an experiment.
    permissible_values:
      planned: {}
      running: {}
      completed: {}
      abandoned: {}

  MilestoneStatusEnum:
    description: Lifecycle of a milestone.
    permissible_values:
      planned: {}
      in_progress: {}
      completed: {}
      missed: {}

  RiskTypeEnum:
    description: Category of a risk.
    permissible_values:
      business: {}
      technical: {}
      regulatory: {}
      market: {}
      execution: {}
      financial: {}

  MaturityStageEnum:
    description: Startup maturity stage.
    permissible_values:
      idea: {}
      prototype: {}
      mvp: {}
      growth: {}
      scale: {}

# ---------------------------------------------------------------------------
# Slots (properties)
#
# Domain/range here also encodes allowed graph predicates.  Slots whose
# range is a class (not a primitive) and whose ``relation: true`` annotation
# is set are emitted as Neo4j relationship types by the Cypher DDL generator.
# ---------------------------------------------------------------------------
slots:
  # ----- identity / shared entity slots -----
  id:
    description: Stable identifier for the entity or relation.
    identifier: true
    required: true
    range: string

  name:
    description: Human-readable display name.
    range: string

  label:
    description: Short label (often used in graphs / UI).
    range: string

  description:
    description: Free-text description.
    range: string

  # ----- provenance -----
  source_document_id:
    description: ID of the document this record was extracted from.
    range: string

  source_file:
    description: Filename of the originating document.
    range: string

  source_snippet:
    description: Original source text excerpt.
    range: string

  source_location:
    description: Coarse location in the source (page, slide, paragraph).
    range: string

  # ----- review lifecycle -----
  evidence_grade:
    description: How directly the source supports the assertion.
    range: EvidenceGradeEnum

  reviewer_confidence:
    description: Human-assigned reviewer confidence.
    range: ReviewerConfidenceEnum

  reviewer_comment:
    description: Free-form reviewer notes.
    range: string

  validation_status:
    description: Lifecycle status of this candidate record.
    range: ValidationStatusEnum

  # ----- bi-temporal (Phase 0.5) -----
  valid_from:
    description: Datetime this version became valid.
    range: datetime

  valid_to:
    description: Datetime this version stopped being valid.
    range: datetime

  superseded_by:
    description: Id of the entity that replaces this one.
    range: string

  # ----- timestamps (Phase 7) -----
  created_at:
    description: Datetime this record was created.
    range: datetime

  updated_at:
    description: Datetime this record was last updated.
    range: datetime

  # ----- Community-specific (Phase 7) -----
  summary:
    description: Short LLM-generated description of a community.
    range: string

  embedding:
    description: Numeric embedding vector.
    range: float
    multivalued: true

  size:
    description: Number of members in a community.
    range: integer

  risk_exposure:
    description: Share of community members carrying high-criticality risk markers.
    range: float

  # ----- Startup-specific -----
  sector:
    description: Industry or sector.
    range: string
  maturity_stage:
    description: Where the startup is in its lifecycle.
    range: MaturityStageEnum
  location:
    description: Geographic location.
    range: string

  # ----- Founder-specific -----
  role:
    description: Role of a founder or partner.
    range: string
  background:
    description: Background of a person.
    range: string

  # ----- CustomerSegment-specific -----
  urgency:
    description: How urgent the need is for this segment.
    range: SeverityEnum
  willingness_to_pay:
    description: How willing the segment is to pay (free-form).
    range: string

  # ----- Problem-specific -----
  severity:
    description: Severity of a problem or impact.
    range: SeverityEnum
  frequency:
    description: How often a problem occurs.
    range: FrequencyEnum

  # ----- ValueProposition-specific -----
  differentiator:
    description: What makes this value proposition stand out.
    range: string

  # ----- ProductFeature-specific -----
  maturity:
    description: Maturity of a feature.
    range: string
  linked_problem:
    description: Free-form pointer to a related problem.
    range: string

  # ----- Assumption-specific -----
  criticality:
    description: Strategic importance of the assumption.
    range: CriticalityEnum
    required: true

  # ----- Evidence-specific -----
  source:
    description: Citation or source attribution.
    range: string
  evidence_type:
    description: Category of evidence.
    range: EvidenceTypeEnum
  strength:
    description: Strength of evidence.
    range: StrengthEnum

  # ----- Risk-specific -----
  risk_type:
    description: Category of a risk.
    range: RiskTypeEnum
  probability:
    description: Probability of the risk materializing.
    range: SeverityEnum
  impact:
    description: Magnitude of the impact.
    range: SeverityEnum
  mitigation:
    description: Mitigation plan.
    range: string

  # ----- Experiment-specific -----
  hypothesis:
    description: Hypothesis under test.
    range: string
  method:
    description: Experimental method.
    range: string
  success_criteria:
    description: How success is measured.
    range: string
  experiment_status:
    description: Experiment lifecycle status.
    range: ExperimentStatusEnum

  # ----- Decision-specific -----
  decision_date:
    description: Date associated with the entity.
    range: date
  rationale:
    description: Why the decision was made.
    range: string
  decided_by:
    description: Decision maker.
    range: string

  # ----- Milestone-specific -----
  deadline:
    description: Deadline of the milestone.
    range: date
  milestone_status:
    description: Milestone lifecycle status.
    range: MilestoneStatusEnum

  # ----- GrantCall-specific -----
  funder:
    description: Funder for a grant call.
    range: string
  themes:
    description: Themes covered by the grant call.
    range: string
    multivalued: true
  fit_score:
    description: How well the startup fits the call.
    range: float

  # ----- Investor-specific -----
  stage:
    description: Stage (preferred investment stage for investors; current stage for projects and processes).
    range: string
  thesis:
    description: Investment thesis.
    range: string

  # ----- Partner-specific / Competitor-specific -----
  status:
    description: Current status of a partnership or asset.
    range: string
  differentiation:
    description: How a competitor differentiates itself.
    range: string

  # ----- IPAsset / RegulatoryConstraint -----
  owner:
    description: Owner of an asset.
    range: string
  jurisdiction:
    description: Regulatory jurisdiction.
    range: string

  # ----- TechnicalDependency -----
  system:
    description: System being depended on.
    range: string
  risk_level:
    description: Risk level of a dependency.
    range: SeverityEnum

  # ----- FinancialHypothesis -----
  metric:
    description: Financial metric the hypothesis concerns.
    range: string
  assumption_text:
    description: Free-form text statement of the financial assumption.
    range: string

  # ===========================================================================
  # Relation slots (predicate definitions)
  #
  # Each of these is annotated with relation: true.  The Cypher generator
  # reads ``domain``/``range``/``annotations.predicate`` to emit allowed
  # triples and per-predicate indexes.
  # ===========================================================================
  targets:
    description: Startup TARGETS CustomerSegment.
    domain: Startup
    range: CustomerSegment
    annotations:
      predicate: TARGETS
      relation: true

  has_problem:
    description: CustomerSegment HAS_PROBLEM Problem.
    domain: CustomerSegment
    range: Problem
    annotations:
      predicate: HAS_PROBLEM
      relation: true

  addresses:
    description: ProductFeature ADDRESSES Problem.
    domain: ProductFeature
    range: Problem
    annotations:
      predicate: ADDRESSES
      relation: true

  based_on:
    description: ValueProposition / Decision BASED_ON Problem / Evidence.
    domain: Entity
    range: Entity
    annotations:
      predicate: BASED_ON
      relation: true

  provides:
    description: Startup / Partner PROVIDES ValueProposition / ProductFeature.
    domain: Entity
    range: Entity
    annotations:
      predicate: PROVIDES
      relation: true

  supported_by:
    description: Assumption SUPPORTED_BY Evidence.
    domain: Assumption
    range: Evidence
    annotations:
      predicate: SUPPORTED_BY
      relation: true

  contradicted_by:
    description: Assumption CONTRADICTED_BY Evidence.
    domain: Assumption
    range: Evidence
    annotations:
      predicate: CONTRADICTED_BY
      relation: true

  tests:
    description: Experiment TESTS Assumption.
    domain: Experiment
    range: Assumption
    annotations:
      predicate: TESTS
      relation: true

  generates:
    description: Experiment GENERATES Evidence.
    domain: Experiment
    range: Evidence
    annotations:
      predicate: GENERATES
      relation: true

  mitigates:
    description: Experiment MITIGATES Risk.
    domain: Experiment
    range: Risk
    annotations:
      predicate: MITIGATES
      relation: true

  threatens:
    description: Risk THREATENS Milestone.
    domain: Risk
    range: Milestone
    annotations:
      predicate: THREATENS
      relation: true

  depends_on:
    description: TechnicalDependency DEPENDS_ON TechnicalDependency.
    domain: TechnicalDependency
    range: TechnicalDependency
    annotations:
      predicate: DEPENDS_ON
      relation: true

  competes_on:
    description: Competitor COMPETES_ON ValueProposition.
    domain: Competitor
    range: ValueProposition
    annotations:
      predicate: COMPETES_ON
      relation: true

  protects:
    description: IPAsset PROTECTS ProductFeature.
    domain: IPAsset
    range: ProductFeature
    annotations:
      predicate: PROTECTS
      relation: true

  funds:
    description: GrantCall FUNDS Experiment.
    domain: GrantCall
    range: Experiment
    annotations:
      predicate: FUNDS
      relation: true

  mentions:
    description: Document MENTIONS Entity.
    domain: Document
    range: Entity
    annotations:
      predicate: MENTIONS
      relation: true

  source_of:
    description: Document SOURCE_OF Evidence.
    domain: Document
    range: Evidence
    annotations:
      predicate: SOURCE_OF
      relation: true

  related_to:
    description: Generic fallback Entity RELATED_TO Entity.
    domain: Entity
    range: Entity
    annotations:
      predicate: RELATED_TO
      relation: true

  supersedes_relation:
    description: Entity SUPERSEDED_BY Entity (bi-temporal lineage).
    domain: Entity
    range: Entity
    annotations:
      predicate: SUPERSEDED_BY
      relation: true

  same_as:
    description: Entity SAME_AS Entity (reversible duplicate marker; Phase 6 entity resolution).
    domain: Entity
    range: Entity
    annotations:
      predicate: SAME_AS
      relation: true

  in_community:
    description: Entity IN_COMMUNITY Community (Phase 7 graph-level summarization).
    domain: Entity
    range: Community
    annotations:
      predicate: IN_COMMUNITY
      relation: true


  # ----- Project-model fields (StartupProject, Standard, ExportFormat, Technology, Metric) -----
  focus_area:
    description: Primary focus area of a startup project.
    range: string

  version:
    description: Version identifier of a standard.
    range: string

  specification:
    description: Specification or reference describing an export format.
    range: string

  category:
    description: Category of a technology.
    range: string

  unit:
    description: Unit of measurement of a metric.
    range: string

  target:
    description: Target value of a metric.
    range: string

  # ----- Project-model relation slots -----
  # Moved here from the legacy startup_ontology.yaml overlay so the generated
  # artifacts (schema.json, shapes.ttl, models.py, Cypher DDL) carry them.
  founded:
    description: Founder FOUNDED Startup.
    domain: Founder
    range: Startup
    annotations:
      predicate: FOUNDED
      relation: true

  startup_project_has_initial_wedge_use_case:
    description: StartupProject HAS_INITIAL_WEDGE UseCase.
    domain: StartupProject
    range: UseCase
    annotations:
      predicate: HAS_INITIAL_WEDGE
      relation: true

  startup_project_has_business_model_business_model_component:
    description: StartupProject HAS_BUSINESS_MODEL BusinessModelComponent.
    domain: StartupProject
    range: BusinessModelComponent
    annotations:
      predicate: HAS_BUSINESS_MODEL
      relation: true

  startup_project_supports_concept:
    description: StartupProject SUPPORTS Concept.
    domain: StartupProject
    range: Concept
    annotations:
      predicate: SUPPORTS
      relation: true

  startup_project_implements_standard:
    description: StartupProject IMPLEMENTS Standard.
    domain: StartupProject
    range: Standard
    annotations:
      predicate: IMPLEMENTS
      relation: true

  startup_project_exports_export_format:
    description: StartupProject EXPORTS ExportFormat.
    domain: StartupProject
    range: ExportFormat
    annotations:
      predicate: EXPORTS
      relation: true

  startup_project_integrates_with_technology:
    description: StartupProject INTEGRATES_WITH Technology.
    domain: StartupProject
    range: Technology
    annotations:
      predicate: INTEGRATES_WITH
      relation: true

  product_module_requires_technical_capability:
    description: ProductModule REQUIRES TechnicalCapability.
    domain: ProductModule
    range: TechnicalCapability
    annotations:
      predicate: REQUIRES
      relation: true

  commercial_process_needs_product_feature:
    description: CommercialProcess NEEDS ProductFeature.
    domain: CommercialProcess
    range: ProductFeature
    annotations:
      predicate: NEEDS
      relation: true

  startup_project_uses_technology:
    description: StartupProject USES Technology.
    domain: StartupProject
    range: Technology
    annotations:
      predicate: USES
      relation: true

  metric_measures_concept:
    description: Metric MEASURES Concept.
    domain: Metric
    range: Concept
    annotations:
      predicate: MEASURES
      relation: true

  person_founded_startup_project:
    description: Person FOUNDED StartupProject.
    domain: Person
    range: StartupProject
    annotations:
      predicate: FOUNDED
      relation: true

  partner_segment_buys_for_use_case:
    description: PartnerSegment BUYS_FOR UseCase.
    domain: PartnerSegment
    range: UseCase
    annotations:
      predicate: BUYS_FOR
      relation: true

  person_leads_technical_development_for_startup_project:
    description: Person LEADS_TECHNICAL_DEVELOPMENT_FOR StartupProject.
    domain: Person
    range: StartupProject
    annotations:
      predicate: LEADS_TECHNICAL_DEVELOPMENT_FOR
      relation: true

  startup_project_generates_export_format:
    description: StartupProject GENERATES ExportFormat.
    domain: StartupProject
    range: ExportFormat
    annotations:
      predicate: GENERATES
      relation: true

  product_module_uses_technical_capability:
    description: ProductModule USES TechnicalCapability.
    domain: ProductModule
    range: TechnicalCapability
    annotations:
      predicate: USES
      relation: true

  technical_capability_supports_export_format:
    description: TechnicalCapability SUPPORTS ExportFormat.
    domain: TechnicalCapability
    range: ExportFormat
    annotations:
      predicate: SUPPORTS
      relation: true

  customer_segment_buys_for_export_format:
    description: CustomerSegment BUYS_FOR ExportFormat.
    domain: CustomerSegment
    range: ExportFormat
    annotations:
      predicate: BUYS_FOR
      relation: true

  customer_segment_needs_product_module:
    description: CustomerSegment NEEDS ProductModule.
    domain: CustomerSegment
    range: ProductModule
    annotations:
      predicate: NEEDS
      relation: true

  partner_segment_integrates_with_technical_capability:
    description: PartnerSegment INTEGRATES_WITH TechnicalCapability.
    domain: PartnerSegment
    range: TechnicalCapability
    annotations:
      predicate: INTEGRATES_WITH
      relation: true

  product_feature_requires_concept:
    description: ProductFeature REQUIRES Concept.
    domain: ProductFeature
    range: Concept
    annotations:
      predicate: REQUIRES
      relation: true

  commercial_process_measures_metric:
    description: CommercialProcess MEASURES Metric.
    domain: CommercialProcess
    range: Metric
    annotations:
      predicate: MEASURES
      relation: true

  business_model_component_supports_concept:
    description: BusinessModelComponent SUPPORTS Concept.
    domain: BusinessModelComponent
    range: Concept
    annotations:
      predicate: SUPPORTS
      relation: true

  business_model_component_requires_technical_capability:
    description: BusinessModelComponent REQUIRES TechnicalCapability.
    domain: BusinessModelComponent
    range: TechnicalCapability
    annotations:
      predicate: REQUIRES
      relation: true

  startup_project_addresses_problem:
    description: StartupProject ADDRESSES Problem.
    domain: StartupProject
    range: Problem
    annotations:
      predicate: ADDRESSES
      relation: true

  use_case_requires_technical_capability:
    description: UseCase REQUIRES TechnicalCapability.
    domain: UseCase
    range: TechnicalCapability
    annotations:
      predicate: REQUIRES
      relation: true

  decision_mitigates_risk:
    description: Decision MITIGATES Risk.
    domain: Decision
    range: Risk
    annotations:
      predicate: MITIGATES
      relation: true

  technical_capability_integrates_with_technology:
    description: TechnicalCapability INTEGRATES_WITH Technology.
    domain: TechnicalCapability
    range: Technology
    annotations:
      predicate: INTEGRATES_WITH
      relation: true

  milestone_depends_on_technology:
    description: Milestone DEPENDS_ON Technology.
    domain: Milestone
    range: Technology
    annotations:
      predicate: DEPENDS_ON
      relation: true

  assumption_supports_concept:
    description: Assumption SUPPORTS Concept.
    domain: Assumption
    range: Concept
    annotations:
      predicate: SUPPORTS
      relation: true

  in_macro_community:
    description: Community IN_MACRO_COMMUNITY MacroCommunity (Level-2 community aggregation).
    domain: Community
    range: MacroCommunity
    annotations:
      predicate: IN_MACRO_COMMUNITY
      relation: true

  total_entity_count:
    description: Total number of entities across a macro-community's member communities.
    range: integer

  max_risk_exposure:
    description: Highest risk_exposure among a macro-community's member communities.
    range: float

  member_count:
    description: Number of Level-1 communities in a macro-community.
    range: integer

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:
  # Root container so we can serialize a whole graph in one document.
  KnowledgeBase:
    tree_root: true
    description: Top-level container for a FounderGraph dataset.
    attributes:
      entities:
        range: Entity
        multivalued: true
        inlined_as_list: true
      relations:
        range: Relation
        multivalued: true
        inlined_as_list: true
      documents:
        range: Document
        multivalued: true
        inlined_as_list: true

  # Shared base mixin so every concrete entity carries the Neo4j Entity label.
  Entity:
    description: Base class for all FounderGraph nodes (mapped to :Entity in Neo4j).
    slots:
      - id
      - name
      - label
      - description
      - source_document_id
      - source_file
      - source_snippet
      - source_location
      - evidence_grade
      - reviewer_confidence
      - reviewer_comment
      - validation_status
      - valid_from
      - valid_to
      - superseded_by

  Document:
    description: A source document the knowledge was extracted from.
    slots:
      - id
      - name
      - description
      - source_file
      - valid_from
      - valid_to

  Relation:
    description: A typed edge between two Entities.
    slots:
      - id
      - source_document_id
      - source_file
      - source_snippet
      - evidence_grade
      - reviewer_confidence
      - reviewer_comment
      - validation_status
      - valid_from
      - valid_to

  Startup:
    is_a: Entity
    description: The startup or project being analyzed.
    slot_usage:
      name:
        required: true
    slots:
      - sector
      - maturity_stage
      - location

  Founder:
    is_a: Entity
    description: A founder or key team member.
    slot_usage:
      name:
        required: true
    slots:
      - role
      - background

  CustomerSegment:
    is_a: Entity
    description: A group of potential users, buyers, or beneficiaries.
    slots:
      - urgency
      - willingness_to_pay

  Problem:
    is_a: Entity
    description: A pain point or unmet need experienced by a customer segment.
    slots:
      - severity
      - frequency

  ValueProposition:
    is_a: Entity
    description: The promised value delivered by the startup.
    slots:
      - differentiator

  ProductFeature:
    is_a: Entity
    description: A technical or functional product component.
    slots:
      - maturity
      - linked_problem

  Assumption:
    is_a: Entity
    description: A claim that is not fully proven yet.
    slot_usage:
      criticality:
        required: true
    slots:
      - criticality

  Evidence:
    is_a: Entity
    description: A source-backed observation supporting or contradicting an assumption.
    slots:
      - source
      - evidence_type
      - strength

  Risk:
    is_a: Entity
    description: A business, technical, regulatory, market, or execution risk.
    slots:
      - risk_type
      - probability
      - impact
      - mitigation

  Experiment:
    is_a: Entity
    description: A test designed to validate or invalidate an assumption.
    slots:
      - hypothesis
      - method
      - success_criteria
      - experiment_status

  Decision:
    is_a: Entity
    description: A strategic or operational decision.
    slots:
      - decision_date
      - rationale
      - decided_by

  Milestone:
    is_a: Entity
    description: A time-bound objective.
    slots:
      - deadline
      - success_criteria
      - milestone_status

  CustomerInterview:
    is_a: Entity
    description: A customer interview, recorded as a graph entity.
    slots:
      - decision_date

  GrantCall:
    is_a: Entity
    description: A funding opportunity.
    slot_usage:
      name:
        required: true
    slots:
      - funder
      - deadline
      - themes
      - fit_score

  Grant:
    is_a: Entity
    description: An awarded grant.
    slots:
      - funder
      - decision_date

  Impact:
    is_a: Entity
    description: A claimed or measured impact.
    slots:
      - description

  Market:
    is_a: Entity
    description: A market segment, channel, or geographic market.
    slots:
      - location

  Investor:
    is_a: Entity
    description: An investor or investment organization.
    slot_usage:
      name:
        required: true
    slots:
      - stage
      - thesis

  Partner:
    is_a: Entity
    description: A partner organization.
    slot_usage:
      name:
        required: true
    slots:
      - role
      - status

  Competitor:
    is_a: Entity
    description: A competing product, company, or workaround.
    slot_usage:
      name:
        required: true
    slots:
      - differentiation

  IPAsset:
    is_a: Entity
    description: An intellectual property asset.
    slots:
      - status
      - owner

  RegulatoryConstraint:
    is_a: Entity
    description: A regulatory or compliance constraint.
    slots:
      - jurisdiction
      - impact

  TechnicalDependency:
    is_a: Entity
    description: A technical dependency or integration requirement.
    slots:
      - system
      - risk_level

  FinancialHypothesis:
    is_a: Entity
    description: A financial forecast or business model hypothesis.
    slots:
      - metric
      - assumption_text

  # Community summarization (Phase 7).  Communities are *not* Entity subtypes:
  # they live on their own ``(:Community)`` label, populated by graph-level
  # clustering (Louvain via GDS, or label-propagation fallback) over the
  # validated entity subgraph.  Each Community carries a short LLM summary,
  # its embedding (indexed via the ``community_embedding`` vector index), and
  # a ``risk_exposure`` ratio so the UI can rank by strategic risk concentration.
  Community:
    description: A graph-level cluster of related Entity nodes with an LLM summary.
    slots:
      - id
      - summary
      - embedding
      - size
      - risk_exposure
      - created_at
      - updated_at

  # Additional shell classes referenced by extractors but with no fields yet.
  Site:
    is_a: Entity
    description: A physical site (lab, office, plant).
  Vendor:
    is_a: Entity
    description: A vendor or supplier.
  Country:
    is_a: Entity
    description: A country reference.
  Blocker:
    is_a: Entity
    description: A blocker preventing forward progress.

  # Level-2 macro-communities aggregate Level-1 communities (see
  # CommunityService.aggregate); indexed via ``macro_community_embedding``.
  MacroCommunity:
    description: A Level-2 cluster of related Community nodes with an LLM summary.
    slots:
      - id
      - summary
      - embedding
      - total_entity_count
      - max_risk_exposure
      - member_count
      - created_at
      - updated_at

  # Project-model classes, moved here from the legacy startup_ontology.yaml overlay.
  StartupProject:
    is_a: Entity
    description: A startup initiative modeled as a structured project entity.
    slots:
      - stage
      - focus_area
  UseCase:
    is_a: Entity
    description: A concrete workflow or problem scenario addressed by the startup.
  Concept:
    is_a: Entity
    description: A domain concept or operating principle relevant to strategy and design.
  Standard:
    is_a: Entity
    description: A formal guideline or interoperability standard.
    slots:
      - version
  ExportFormat:
    is_a: Entity
    description: A supported data export format.
    slots:
      - specification
  ProductModule:
    is_a: Entity
    description: A named product module in the platform architecture.
  TechnicalCapability:
    is_a: Entity
    description: A technical capability that enables product behavior.
    slots:
      - maturity
  Technology:
    is_a: Entity
    description: A technology, tool, or external platform dependency.
    slots:
      - category
  Person:
    is_a: Entity
    description: A person involved in founding, building, or operating the startup.
    slots:
      - role
  PartnerSegment:
    is_a: Entity
    description: A partner or buyer segment connected to a use case.
  BusinessModelComponent:
    is_a: Entity
    description: A component of the business model such as pricing or channel.
  CommercialProcess:
    is_a: Entity
    description: A commercial or go-to-market process step.
    slots:
      - stage
  Metric:
    is_a: Entity
    description: A measurable KPI or outcome used for decision-making.
    slots:
      - unit
      - target
