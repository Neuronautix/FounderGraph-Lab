# FounderGraph-Lab — GraphRAG index configuration
# Copy this file to $GRAPHRAG_ROOT/settings.yaml before running graphrag index.
# Set GRAPHRAG_API_KEY=<your OpenAI API key> in the environment.

reporting:
  type: file
  base_dir: "${GRAPHRAG_ROOT}/logs"

storage:
  type: file
  base_dir: "${GRAPHRAG_ROOT}/output"

cache:
  type: file
  base_dir: "${GRAPHRAG_ROOT}/cache"

input:
  type: file
  file_type: text
  base_dir: "${GRAPHRAG_ROOT}/input"
  file_pattern: ".*\\.txt$"

chunks:
  size: 1200
  overlap: 100
  group_by_columns: [id]

embed_graph:
  enabled: false

encoding_model: cl100k_base

models:
  default_chat_model:
    api_key: "${GRAPHRAG_API_KEY}"
    type: openai_chat
    model: gpt-4o-mini
    max_tokens: 4000
    temperature: 0

  default_embedding_model:
    api_key: "${GRAPHRAG_API_KEY}"
    type: openai_embedding
    model: text-embedding-3-small

entity_extraction:
  prompt: "prompts/entity_extraction.txt"
  entity_types:
    - CustomerSegment
    - Problem
    - ValueProposition
    - ProductFeature
    - Assumption
    - Evidence
    - Risk
    - Experiment
    - Decision
    - Milestone
    - GrantCall
    - Investor
    - Partner
    - Competitor
    - IPAsset
    - RegulatoryConstraint
    - TechnicalDependency
    - FinancialHypothesis
  max_gleanings: 1

summarize_descriptions:
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

claim_extraction:
  enabled: false

community_reports:
  prompt: "prompts/community_report.txt"
  max_length: 2000
  max_input_length: 8000

cluster_graph:
  max_cluster_size: 10

local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  top_k_mapped_entities: 10
  top_k_relationships: 10
  max_tokens: 12000

global_search:
  max_tokens: 12000
  map_max_tokens: 1000
  reduce_max_tokens: 2000
  concurrency: 4
